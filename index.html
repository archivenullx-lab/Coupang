<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>쿠팡 링크모음</title>
    <meta name="description" content="자주 찾는 쿠팡 상품을 한곳에 모아둔 링크 모음 페이지" />
    <meta property="og:title" content="쿠팡 링크모음" />
    <meta property="og:description" content="자주 찾는 쿠팡 상품을 한곳에 모아둔 링크 모음 페이지" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --border: #e5e9f2;
            --primary: #4f46e5;
            --primary-soft: #eef0ff;
            --accent: #0ea5e9;
            --text-main: #111827;
            --text-sub: #6b7280;
            --notice-bg: #fff7ed;
            --notice-border: #fed7aa;
            --notice-text: #9a3412;
            --shadow: 0 6px 18px rgba(30, 41, 90, 0.07);
            --shadow-hover: 0 12px 26px rgba(30, 41, 90, 0.13);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1220;
                --card: #181c30;
                --border: #262b45;
                --primary: #818cf8;
                --primary-soft: #232848;
                --accent: #38bdf8;
                --text-main: #f3f4f8;
                --text-sub: #9aa3b8;
                --notice-bg: #2a1d14;
                --notice-border: #5a3a1f;
                --notice-text: #fdba74;
                --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
                --shadow-hover: 0 12px 26px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        }

        body {
            background:
                radial-gradient(900px 380px at 50% -120px, rgba(79, 70, 229, 0.18), transparent 70%),
                radial-gradient(600px 300px at 90% 0, rgba(14, 165, 233, 0.12), transparent 70%),
                var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px calc(40px + env(safe-area-inset-bottom));
            -webkit-text-size-adjust: 100%;
        }

        .wrap {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        /* ---------- 상단 ---------- */
        .hero {
            text-align: center;
            margin-bottom: 22px;
        }

        .badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            font-size: 30px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.35);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        /* ---------- 파트너스 고지 ---------- */
        .notice {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            background: var(--notice-bg);
            border: 1px solid var(--notice-border);
            color: var(--notice-text);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 22px;
            font-size: 13.5px;
            line-height: 1.5;
            font-weight: 600;
            text-align: left;
        }

        .notice-icon {
            flex: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--notice-bg);
            background: var(--notice-text);
            margin-top: 1px;
        }

        /* ---------- 상품 카드 ---------- */
        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            animation: rise 0.45s ease both;
            animation-delay: calc(var(--i, 0) * 60ms);
        }

        @media (hover: hover) {
            .card:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-hover);
                border-color: var(--primary);
            }
        }

        .card:active {
            transform: scale(0.98);
        }

        .card:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        .thumb {
            flex: none;
            width: 76px;
            height: 76px;
            border-radius: 14px;
            overflow: hidden;
            background: var(--primary-soft);
            display: grid;
            place-items: center;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumb.fallback {
            font-size: 34px;
            background: linear-gradient(135deg, var(--primary-soft), var(--card));
        }

        .info {
            flex: 1;
            min-width: 0;
        }

        .name {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -0.01em;
            word-break: keep-all;
        }

        .desc {
            margin-top: 3px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.4;
            word-break: keep-all;
        }

        .go {
            margin-top: 6px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--primary);
        }

        .arrow {
            flex: none;
            color: var(--text-sub);
            font-size: 20px;
            padding-right: 4px;
        }

        .empty {
            text-align: center;
            color: var(--text-sub);
            padding: 40px 0;
            font-size: 14px;
        }

        /* ---------- 하단 ---------- */
        footer {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-sub);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; transition: none; }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <header class="hero">
            <div class="badge" id="badge" aria-hidden="true"></div>
            <h1 id="title"></h1>
            <p class="subtitle" id="subtitle"></p>
        </header>

        <aside class="notice" role="note">
            <span class="notice-icon" aria-hidden="true">i</span>
            <p id="notice"></p>
        </aside>

        <section class="list" id="list" aria-label="상품 목록"></section>

        <footer id="footer"></footer>
    </main>

    <script>
        /* =====================================================================
           ✏️ 여기만 고치면 됩니다 (폰에서 수정할 때도 이 부분만 보세요)
           ===================================================================== */

        // 1) 페이지 기본 문구
        const SITE = {
            icon: "🛒",
            title: "쿠팡 링크모음",
            subtitle: "자주 찾는 상품을 한곳에 모아뒀어요",
            notice: "쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.",
            footer: "가격·재고·배송 정보는 쿠팡 상품 페이지에서 확인해 주세요."
        };

        // 2) 상품 목록 — 위에서부터 순서대로 보입니다.
        //    상품 하나 = { ... }, 한 덩어리를 복사해서 추가하세요.
        //
        //    name   : 상품 이름 (필수)
        //    url    : 쿠팡 파트너스 링크 (필수)
        //    image  : 상품 이미지 주소 또는 파일 경로 (선택)
        //             예) "https://....jpg"  또는  "images/mushroom.jpg"
        //             비워두면 아래 emoji가 대신 표시됩니다.
        //    emoji  : 이미지가 없을 때 보여줄 이모지 (선택)
        //    desc   : 상품 설명 한 줄 (선택)
        //    hidden : true 로 바꾸면 삭제하지 않고 잠깐 숨깁니다 (선택)
        const PRODUCTS = [
            {
                name: "친환경 느타리버섯",
                url: "https://link.coupang.com/a/dm8AGD",
                image: "",
                emoji: "🍄",
                desc: ""
            },
            {
                name: "단호박샐러드",
                url: "https://link.coupang.com/a/dm8Dod",
                image: "",
                emoji: "🎃",
                desc: ""
            },
            {
                name: "통밀가득 식빵",
                url: "https://link.coupang.com/a/dm8FGQ",
                image: "",
                emoji: "🍞",
                desc: ""
            },
            {
                name: "탄산수",
                url: "https://link.coupang.com/a/dm8tqm",
                image: "",
                emoji: "🫧",
                desc: ""
            },
            {
                name: "물티슈",
                url: "https://link.coupang.com/a/dmxm2B",
                image: "",
                emoji: "🧻",
                desc: ""
            }
        ];

        /* =====================================================================
           아래는 화면을 그리는 코드입니다. 건드리지 않아도 됩니다.
           ===================================================================== */

        document.getElementById("badge").textContent = SITE.icon;
        document.getElementById("title").textContent = SITE.title;
        document.getElementById("subtitle").textContent = SITE.subtitle;
        document.getElementById("notice").textContent = SITE.notice;
        document.getElementById("footer").textContent = SITE.footer;

        const list = document.getElementById("list");
        const items = PRODUCTS.filter(p => p && !p.hidden && p.name && p.url);

        if (items.length === 0) {
            const empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "준비 중이에요. 곧 상품이 올라와요!";
            list.appendChild(empty);
        }

        items.forEach((p, i) => {
            const a = document.createElement("a");
            a.className = "card";
            a.href = p.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer sponsored";
            a.style.setProperty("--i", i);

            // 썸네일 (이미지가 없거나 불러오기 실패하면 이모지로 대체)
            const thumb = document.createElement("div");
            thumb.className = "thumb";
            const showFallback = () => {
                thumb.textContent = p.emoji || "🛍️";
                thumb.classList.add("fallback");
            };
            if (p.image) {
                const img = new Image();
                img.alt = "";
                img.loading = "lazy";
                img.referrerPolicy = "no-referrer";
                img.onerror = showFallback;
                img.src = p.image;
                thumb.appendChild(img);
            } else {
                showFallback();
            }

            // 텍스트
            const info = document.createElement("div");
            info.className = "info";

            const name = document.createElement("div");
            name.className = "name";
            name.textContent = p.name;
            info.appendChild(name);

            if (p.desc) {
                const desc = document.createElement("div");
                desc.className = "desc";
                desc.textContent = p.desc;
                info.appendChild(desc);
            }

            const go = document.createElement("div");
            go.className = "go";
            go.textContent = "쿠팡에서 보기";
            info.appendChild(go);

            const arrow = document.createElement("span");
            arrow.className = "arrow";
            arrow.setAttribute("aria-hidden", "true");
            arrow.textContent = "›";

            a.append(thumb, info, arrow);
            list.appendChild(a);
        });
    </script>
</body>
</html>
